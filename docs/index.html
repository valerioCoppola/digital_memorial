<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federico Frusciante — Digital Memorial</title>
    <meta name="description" content="Archivio completo delle trascrizioni di oltre 4000 video di Federico Frusciante. Critico cinematografico, musicista post-punk, custode di Videodrome.">
    <meta property="og:title" content="Federico Frusciante — Digital Memorial">
    <meta property="og:description" content="4000+ trascrizioni video • 2014–2026 • Critico cinematografico, voce libera del cinema italiano">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #f0e6d2; font-family: 'DM Sans', sans-serif; }
        #root { min-height: 100vh; }
        /* Loading screen */
        .loading-screen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; gap: 24px;
        }
        .loading-screen h1 {
            font-family: 'Playfair Display', serif; font-size: 2rem;
            color: #e8a946; font-weight: 400;
        }
        .loading-screen p {
            color: #555; font-size: 0.8rem; letter-spacing: 0.1em;
        }
        .spinner {
            width: 32px; height: 32px; border: 2px solid #222;
            border-top-color: #e8a946; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <h1>Federico <em>Frusciante</em></h1>
            <div class="spinner"></div>
            <p>Caricamento memoriale...</p>
        </div>
    </div>

    <!-- React + Babel for JSX transformation (no build step needed) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

    <!-- App -->
    <script type="text/babel" src="app.jsx"></script>
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(FruscianteMemorial));
    </script>
</body>
</html>
